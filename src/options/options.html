<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>网申助手 · 资料库</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="layout">
    <nav class="nav">
      <div class="brand">自维护网申助手</div>
      <a data-tab="basic" class="active">基本信息</a>
      <a data-tab="educations">教育经历</a>
      <a data-tab="internships">实习/工作经历</a>
      <a data-tab="projects">项目经历</a>
      <a data-tab="awards">获奖情况</a>
      <a data-tab="rules">站点规则</a>
      <a data-tab="settings">设置与备份</a>
    </nav>
    <main class="main">
      <div id="tab-basic" class="tab active"></div>
      <div id="tab-educations" class="tab"></div>
      <div id="tab-internships" class="tab"></div>
      <div id="tab-projects" class="tab"></div>
      <div id="tab-awards" class="tab"></div>
      <div id="tab-rules" class="tab"></div>
      <div id="tab-settings" class="tab"></div>
      <div class="savebar"><button id="saveAll" class="primary">保存全部资料</button><span id="saveMsg"></span></div>
    </main>
  </div>
  <script src="../shared/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
