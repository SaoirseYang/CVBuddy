<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>网申助手 · 资料库</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">申</span>
        <div><b>网申助手</b><small>资料库 · 词典 · 规则</small></div>
      </div>
      <input id="navSearch" class="navsearch" placeholder="搜索板块…" />
      <nav class="nav" id="nav"></nav>
      <div class="sidefoot">
        <button id="exportQuick" class="btn sm" style="width:100%">导出全部数据</button>
      </div>
    </aside>

    <main class="main">
      <header class="pagehead">
        <h1 id="pageTitle">基本信息</h1>
        <p id="pageDesc"></p>
      </header>
      <section id="content"></section>
      <div class="savebar">
        <button id="saveAll" class="btn primary">保存全部资料</button>
        <button id="reload" class="btn">重新载入</button>
        <span id="saveMsg" class="msg"></span>
        <span class="muted" style="margin-left:auto" id="saveHint">改动后记得保存；站点规则与词典是即时保存的</span>
      </div>
    </main>
  </div>
  <script src="../shared/dictionary.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/builtin-rules.js"></script>
  <script src="options.js"></script>
</body>
</html>
