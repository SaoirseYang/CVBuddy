<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="head">
    <span id="domain" class="domain">-</span>
    <span id="ruleStatus" class="tag">检查中</span>
  </div>

  <div class="strategy">
    <label>顺序
      <select id="order">
        <option value="">自动</option>
        <option value="latest-first">最新优先</option>
        <option value="earliest-first">最早优先（高中起）</option>
      </select>
    </label>
    <label>高中
      <select id="hs">
        <option value="">自动</option>
        <option value="all">包含</option>
        <option value="nohs">不含</option>
      </select>
    </label>
  </div>

  <div class="btns">
    <button id="fill" class="primary">开始填写本页</button>
    <button id="scan">扫描预览</button>
    <button id="stop">停止</button>
  </div>
  <div class="btns sub">
    <label class="chk"><input type="checkbox" id="autoNext" />自动翻页</label>
    <label class="chk"><input type="checkbox" id="teach" />教学模式</label>
  </div>
  <div class="btns sub">
    <label class="chk"><input type="checkbox" id="bridge" />实时同步给 WorkBuddy</label>
    <span id="bridgeStatus" class="tag">未开启</span>
  </div>
  <div class="btns sub">
    <button id="hud">页面面板</button>
    <button id="snapshot" title="导出当前页面 DOM（含已填值），离线分析用">导出页面快照</button>
  </div>

  <div id="plan" class="plan" style="display:none"></div>

  <div id="log" class="log"></div>

  <a href="#" id="openOptions">打开资料库 / 词典 / 规则管理 →</a>
  <script src="../shared/dictionary.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
